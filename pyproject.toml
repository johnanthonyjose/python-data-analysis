[project]
name = "python-data-analysis"
version = "0.1.0"
description = "Course notebooks: Python for data analysis"
readme = "README.md"
# Matches the student image (JupyterHub): Python 3.13.
requires-python = ">=3.13"
# Runtime only: exactly what a notebook imports. The student image installs THIS set from uv.lock
# (plus this package), so notebooks and their environment can never drift apart.
dependencies = [
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
]

[dependency-groups]
# Local authoring / self-study tools. The student image already ships JupyterLab, so these stay out of it.
lab = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]
dev = [
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "nbstripout>=0.9.1",
]

[tool.uv]
# `uv sync` installs the runtime + lab + dev groups: everything needed to learn, author and verify locally.
default-groups = ["lab", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_checks", "src/course_viz"]
